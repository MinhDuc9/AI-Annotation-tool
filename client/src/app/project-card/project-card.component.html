<mat-card class="example-card" appearance="outlined">
  <img
    mat-card-image
    src={{ imageUrl() }}
    alt="Photo of a Shiba Inu"
  />
  <mat-card-header>
    <div mat-card-avatar class={{ userProfilePicture() }}></div>
    <mat-card-title>{{ title() }}</mat-card-title>
  </mat-card-header>
  <mat-card-actions>
    <button matButton>DELETE</button>
  </mat-card-actions>
</mat-card>
