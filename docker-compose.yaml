services:
    server:
        build:
            context: ./server
            dockerfile: Dockerfile
        command: pnpm run start:dev
        volumes:
            - ./server:/app
            - /app/node_modules
        environment:
            HOST: postgres
            REDIS_HOST: redis
            PORT: 8080
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "8080:8080"

    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: webAnnotation
            POSTGRES_USER: leduc
            POSTGRES_PASSWORD: password
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U leduc -d webAnnotation"]
            interval: 10s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 10

volumes:
    pgdata:
    redisdata:
