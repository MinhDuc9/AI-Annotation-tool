services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: pnpm run start:dev
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      HOST: postgres
      REDIS_HOST: redis
      PORT: 8080
      AI_ANALYZE_ENDPOINT: http://ai-server:8000/analyze
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-server:
        condition: service_started
    ports:
      - "8080:8080"

  ai-server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: ai-service
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --workers 7
    volumes:
      - ./server/ai_server/Bird-Detection-main:/app/ai_server/Bird-Detection-main
      - ./server/uploads:/app/uploads
    environment:
      LOCAL_IMAGE_ROOT: /app/uploads
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    command: pnpm exec ng serve --host 0.0.0.0 --port 4200
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      server:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: webAnnotation
      POSTGRES_USER: leduc
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leduc -d webAnnotation"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
